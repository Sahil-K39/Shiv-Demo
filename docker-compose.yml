services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: shiv-shakti-backend
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - GIN_MODE=release
      - JWT_SECRET=${JWT_SECRET:-shiv-shakti-dev-secret-change-in-production-2026}
      - DB_PATH=/app/data/shiv_shakti.db
      - CORS_ORIGIN=${CORS_ORIGIN:-http://localhost:3000}
    volumes:
      - sqlite_data:/app/data
      - ./assets:/app/assets
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: shiv-shakti-frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:8080}
      - NEXT_PUBLIC_IMAGE_HOSTNAME=${NEXT_PUBLIC_IMAGE_HOSTNAME:-localhost}
      - INTERNAL_BACKEND_URL=http://backend:8080
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  sqlite_data:
    driver: local
