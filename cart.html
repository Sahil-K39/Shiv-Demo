<script>
  document.addEventListener('DOMContentLoaded', () => {

    // Custom Cursor
    const cursorDot = document.querySelector('.cursor-dot');
    const cursorOutline = document.querySelector('.cursor-outline');
    let mouseX = 0, mouseY = 0; let outlineX = 0, outlineY = 0;
    window.addEventListener('mousemove', (e) => { mouseX = e.clientX; mouseY = e.clientY; if(cursorDot) { cursorDot.style.left = mouseX + 'px'; cursorDot.style.top = mouseY + 'px'; } });
    const animateCursor = () => { let dx = mouseX - outlineX; let dy = mouseY - outlineY; outlineX += dx * 0.2; outlineY += dy * 0.2; if(cursorOutline) { cursorOutline.style.left = outlineX + 'px'; cursorOutline.style.top = outlineY + 'px'; } requestAnimationFrame(animateCursor); };
    animateCursor();

    document.querySelectorAll('a, button, .magnetic').forEach(elem => {
      if(elem.classList.contains('magnetic')) {
        elem.addEventListener('mousemove', (e) => {
          const pos = elem.getBoundingClientRect();
          elem.style.transform = `translate(${(e.clientX - pos.left - pos.width/2) * 0.3}px, ${(e.clientY - pos.top - pos.height/2) * 0.3}px)`;
        });
        elem.addEventListener('mouseleave', () => { elem.style.transform = `translate(0px, 0px)`; });
      }
      elem.addEventListener('mouseenter', () => { if(cursorOutline) { cursorOutline.style.width = '60px'; cursorOutline.style.height = '60px'; cursorOutline.style.backgroundColor = 'rgba(255,255,255,0.05)'; } });
      elem.addEventListener('mouseleave', () => { if(cursorOutline) { cursorOutline.style.width = '40px'; cursorOutline.style.height = '40px'; cursorOutline.style.backgroundColor = 'transparent'; } });
    });

    // Cart Logic
    const cartContainer = document.getElementById('cart-items-container');
    const subtotalEl = document.getElementById('summary-subtotal');
    const totalEl = document.getElementById('summary-total');
    let cart = JSON.parse(localStorage.getItem('shiv_cart') || '[]');

    const renderCart = () => {
        cartContainer.innerHTML = '';
        let total = 0;

        if(cart.length === 0) {
            cartContainer.innerHTML = '<p class="text-[14px] tracking-[0.2em] text-gray-500 uppercase mt-10">THE VOID IS EMPTY.</p>';
            subtotalEl.innerText = '$0.00';
            totalEl.innerText = '$0.00';
            return;
        }

        cart.forEach((item, index) => {
            total += (item.price * item.quantity);
            const itemHTML = `
            <div class="flex gap-6 border border-black/10 p-4 relative group">
                <button onclick="removeItem(${index})" class="absolute top-4 right-4 text-gray-400 hover:text-black transition-colors"><span class="material-symbols-outlined text-sm">close</span></button>
                <div class="w-32 aspect-[3/4] bg-gray-100 flex-shrink-0">
                <img class="w-full h-full object-cover grayscale mix-blend-multiply" src="${item.image}" alt="Item"/>
                </div>
                <div class="flex flex-col justify-between flex-grow py-2">
                <div>
                <h3 class="text-[14px] md:text-[18px] tracking-[0.2em] uppercase font-medium">${item.name}</h3>
                <p class="text-[11px] tracking-[0.1em] text-gray-500 mt-2">SIZE: ${item.size} / COLOR: ${item.color}</p>
                </div>
                <div class="flex justify-between items-end">
                <div class="flex items-center border border-black/20 w-max">
                <button onclick="updateQuantity(${index}, -1)" class="px-3 py-1 hover:bg-black hover:text-white transition-colors">-</button>
                <span class="px-4 text-[12px]">${item.quantity}</span>
                <button onclick="updateQuantity(${index}, 1)" class="px-3 py-1 hover:bg-black hover:text-white transition-colors">+</button>
                </div>
                <span class="text-[14px] tracking-[0.1em] font-medium">$${(item.price * item.quantity).toFixed(2)}</span>
                </div>
                </div>
            </div>`;
            cartContainer.innerHTML += itemHTML;
        });

        subtotalEl.innerText = `$${total.toFixed(2)}`;
        totalEl.innerText = `$${total.toFixed(2)}`;
    };

    window.removeItem = (index) => {
        cart.splice(index, 1);
        localStorage.setItem('shiv_cart', JSON.stringify(cart));
        renderCart();
    };

    window.updateQuantity = (index, delta) => {
        if(cart[index].quantity + delta > 0) {
            cart[index].quantity += delta;
            localStorage.setItem('shiv_cart', JSON.stringify(cart));
            renderCart();
        }
    };

    renderCart();

    // Checkout Logic
    const checkoutBtn = document.getElementById('checkout-btn');
    const checkoutText = document.getElementById('checkout-btn-text');
    
    checkoutBtn.addEventListener('click', async () => {
        if(cart.length === 0) return;
        const token = localStorage.getItem('shiv_token');
        if(!token) {
            window.location.href = 'login.html';
            return;
        }

        checkoutText.innerText = "TRANSMITTING ORDER...";
        
        const total = cart.reduce((acc, item) => acc + (item.price * item.quantity), 0);
        
        try {
            const res = await fetch('http://127.0.0.1:8000/api/checkout', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ token, items: cart.map(i => ({product_id: i.id, quantity: i.quantity, size: i.size, color: i.color})), total_amount: total })
            });
            const data = await res.json();
            
            if (res.ok) {
                checkoutText.innerText = "ORDER ACCEPTED";
                localStorage.removeItem('shiv_cart');
                setTimeout(() => {
                    cart = [];
                    renderCart();
                    checkoutText.innerText = "INITIATE CHECKOUT";
                }, 2000);
            } else {
                checkoutText.innerText = "UNAUTHORIZED / LOGIN REQUIRED";
                setTimeout(() => window.location.href = 'login.html', 1500);
            }
        } catch (error) {
            checkoutText.innerText = "SERVER DISCONNECTED";
            setTimeout(() => checkoutText.innerText = "INITIATE CHECKOUT", 2000);
        }
    });
  });
</script>
